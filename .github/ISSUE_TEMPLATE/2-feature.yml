name: Feature request
description: Suggest a new feature or an improvement.
type: Feature
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea!
        Please check the [existing issues](https://github.com/Gharan-WoW-Addons/CraftJourney/issues) first, it may already be planned.

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What do you want to do, and what is missing today?
      placeholder: e.g. As a player with several characters, I want to see on my warrior how much wool my priest still needs, so that I know what to farm.
    validations:
      required: true

  - type: textarea
    id: proposed-feature
    attributes:
      label: Proposed feature
      description: What would you like the addon to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you thought about, other addons doing it…

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, examples, anything else that helps.
